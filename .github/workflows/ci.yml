name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # SAT-465 hardening (Architect review, PR #48 round 2): decisive job-level
    # cap. Without this, GitHub's default (360 min) is the only backstop, and
    # the adversarial-suite gate alone has an 8-file x 60s-per-file worst case
    # (~8 min). 15 min gives real runtime (~10-15s today) generous headroom
    # while still bounding a hang to something a human notices same-day.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm audit --audit-level=high
      - name: Run the full test suite
        run: |
          set -e
          for f in test/*.mjs; do
            case "$f" in
              # SAT-465-SKIP-LIST-START (auto-checked by test/adversarial-suite.test.mjs)
              # Already run, named + audited, by the SAT-465 adversarial-suite gate below
              # (test/adversarial-suite.test.mjs, itself picked up by this same glob) --
              # running them again here would execute each one twice per job for zero
              # added coverage. Keep this list in exact sync with that file's SUITE array.
              test/security-fixtures.mjs|test/redteam-fixtures.mjs|test/key-store-quorum-redteam.mjs|test/trust-root-adversarial.test.mjs|test/rendering-adversarial.test.mjs|test/policy-fuzzer.mjs|test/auth-oracle-fuzz.test.mjs|test/regulated-sim-fixtures.mjs)
              # SAT-465-SKIP-LIST-END
                continue ;;
            esac
            echo "== $f =="
            node "$f"
          done